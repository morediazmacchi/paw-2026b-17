# ============================================================
#  Mail texts - ENGLISH
# ============================================================

# --- shared ---
mail.brand=plancito
mail.footer=You are receiving this email because you used plancito.
mail.event.when=When
mail.event.where=Where
mail.event.price=Price
mail.event.free=Free

# --- 1. event created (goes to the creator): an admin hasn't reviewed it yet
# (see EventApprovalStatus), so this never says "it's live" -- that's
# mail.eventApproved, below.
mail.eventPendingApproval.subject=We got your event "{0}": it's under review
mail.eventPendingApproval.title=We got your event
mail.eventPendingApproval.greeting=Hi {0},
mail.eventPendingApproval.body=An administrator will review your event before it becomes visible to others. We'll let you know as soon as they review it.
mail.eventPendingApproval.cta=View my event

# --- 2. registration confirmed (goes to the attendee) ---
mail.registrationConfirmed.subject=Your spot at "{0}" is confirmed
mail.registrationConfirmed.title=You're in!
mail.registrationConfirmed.greeting=Hi {0},
mail.registrationConfirmed.body=Your registration is confirmed. See you there.
mail.registrationConfirmed.cta=Go to my registrations

# --- 3. new registration (goes to the creator) ---
mail.newRegistration.subject=Someone else joined "{0}"
mail.newRegistration.title=You have a new registration
mail.newRegistration.greeting=Hi {0},
mail.newRegistration.body={0} signed up for your event.
mail.newRegistration.cta=View registrations

# --- 4. you registered (or completed a ghost account): confirm your email ---
mail.accountVerification.subject=Confirm your plancito account
mail.accountVerification.title=Almost there!
mail.accountVerification.greeting=Hi {0},
mail.accountVerification.body=Confirm your account so you can log in to plancito.
mail.accountVerification.cta=Confirm my account

# --- 5. you requested "forgot my password" ---
mail.passwordReset.subject=Reset your plancito password
mail.passwordReset.title=Reset your password
mail.passwordReset.greeting=Hi {0},
mail.passwordReset.body=You requested to reset your password. If it wasn't you, ignore this email.
mail.passwordReset.cta=Choose a new password

# --- 6. you're on the waiting list (goes to the registrant) ---
mail.waitlistJoined.subject=You''re on the waiting list for "{0}"
mail.waitlistJoined.title=You're on the waiting list
mail.waitlistJoined.greeting=Hi {0},
mail.waitlistJoined.body=This event is already full, so we added you to the waiting list. We'll email you if a spot opens up.
mail.waitlistJoined.cta=Go to my registrations

# --- 7. someone joined your event's waiting list (goes to the creator) ---
mail.waitlistNewEntry.subject=Someone is waiting for a spot at "{0}"
mail.waitlistNewEntry.title=Someone is on your waiting list
mail.waitlistNewEntry.greeting=Hi {0},
mail.waitlistNewEntry.body={0} joined the waiting list because your event is already full.
mail.waitlistNewEntry.cta=View registrations

# --- 8. a spot opened up: invitation with a link (goes to whoever is first in line) ---

# --- 9. you registered for an event that requires organizer approval (goes to the attendee) ---
mail.registrationPending.subject=We got your request for "{0}"
mail.registrationPending.title=Your request is under review
mail.registrationPending.greeting=Hi {0},
mail.registrationPending.body=This event requires the organizer to confirm each registration. We'll let you know as soon as they review it.
mail.registrationPending.cta=Go to my registrations

# --- 10. someone requested to join your event that requires approval (goes to the creator) ---
mail.newPendingRegistration.subject=You have a request to review for "{0}"
mail.newPendingRegistration.title=You have a new request
mail.newPendingRegistration.greeting=Hi {0},
mail.newPendingRegistration.body={0} requested to join your event. You need to accept or reject it.
mail.newPendingRegistration.cta=Accept or reject

# --- 11. the creator approved your pending request (goes to the attendee) ---
mail.registrationApproved.subject=Your spot at "{0}" is confirmed
mail.registrationApproved.title=The organizer confirmed you!
mail.registrationApproved.greeting=Hi {0},
mail.registrationApproved.body=The organizer reviewed your request and you're in. See you there.
mail.registrationApproved.cta=Go to my registrations

# --- 12. the creator rejected your pending request (goes to the attendee) ---
mail.registrationRejected.subject=Your request for "{0}" wasn''t accepted
mail.registrationRejected.title=Your request wasn't accepted
mail.registrationRejected.greeting=Hi {0},
mail.registrationRejected.body=The organizer of "{0}" didn''t accept your registration request this time.
mail.registrationRejected.cta=View other events

# --- 13. you were invited to a private event (goes to the invited person) ---
mail.eventInvitation.subject=You''re invited to "{0}"
mail.eventInvitation.title=You have an invitation!
mail.eventInvitation.greeting=Hi {0},
mail.eventInvitation.body=Someone invited you to a private event. Only you (and whoever else is invited) can see it.
mail.eventInvitation.cta=View the event
mail.eventInvitation.footnote=To see it, log in with this email's account. If you don't have one yet, you can create it.

# --- 9. your event is full (goes to the creator) ---
mail.eventFull.subject=Your event "{0}" is full
mail.eventFull.title=Your event is full!
mail.eventFull.greeting=Hi {0},
mail.eventFull.body=The last spot at your event has just been taken.
mail.eventFull.cta=View my event
mail.eventFull.footnote=From now on, anyone who signs up joins the waiting list. If someone cancels, their spot automatically goes to the first person in line.

# --- 10. someone cancelled their spot at your event (goes to the creator) ---
mail.registrationCancelled.subject=A spot opened up at "{0}"
mail.registrationCancelled.title=Someone cancelled their registration
mail.registrationCancelled.greeting=Hi {0},
mail.registrationCancelled.body={0} cancelled their registration for your event.
mail.registrationCancelled.offered=Since people were waiting, the first person on the waiting list already moved forward: they're confirmed, or pending your approval if the event requires it.
mail.registrationCancelled.open=The spot is now open for someone else to take.
mail.registrationCancelled.cta=View my event

# --- 14. the organizer cancelled the event (goes to each confirmed attendee) ---
mail.eventCancelled.subject=The event "{0}" was cancelled
mail.eventCancelled.title=An event you registered for was cancelled
mail.eventCancelled.greeting=Hi {0},
mail.eventCancelled.body=The organizer cancelled "{0}". We''re sorry for the inconvenience.
mail.eventCancelled.cta=View other events

# --- 15. the organizer edited the event (goes to each confirmed attendee) ---
mail.eventUpdated.subject="{0}" was updated
mail.eventUpdated.title=An event you're registered for changed
mail.eventUpdated.greeting=Hi {0},
mail.eventUpdated.body=The organizer updated the details of "{0}". Make sure it still works for you.
mail.eventUpdated.cta=View my event

# Automatic reminder: the event starts in less than 24 hours.
mail.eventReminder.subject="{0}" is in less than 24 hours
mail.eventReminder.title=It's almost time!
mail.eventReminder.greeting=Hi {0},
mail.eventReminder.body=Just a reminder: "{0}" starts in less than 24 hours. See you there!
mail.eventReminder.cta=View the event
mail.organizerReminder.subject=Less than 24 hours until "{0}"
mail.organizerReminder.title=Your event is in less than 24 hours
mail.organizerReminder.greeting=Hi {0},
mail.organizerReminder.body=There are less than 24 hours until "{0}". You can check who is registered.
mail.organizerReminder.cta=View attendees

# Questions and answers
mail.newQuestion.subject=You got a question about "{0}"
mail.newQuestion.title=You have a new question
mail.newQuestion.greeting=Hi {0},
mail.newQuestion.body={0} asked about "{1}":
mail.newQuestion.cta=Answer
mail.questionAnswered.subject=Your question about "{0}" was answered
mail.questionAnswered.title=Your question has an answer
mail.questionAnswered.greeting=Hi {0},
mail.questionAnswered.body=The organizer of "{0}" answered your question.
mail.questionAnswered.question=Your question
mail.questionAnswered.answer=Answer
mail.questionAnswered.cta=View the event

# Lista de espera: se libero un lugar y pasa directo a confirmado
mail.waitlistPromoted.subject=You got a spot at "{0}"!
mail.waitlistPromoted.title=You're in!
mail.waitlistPromoted.greeting=Hi {0},
mail.waitlistPromoted.body=A spot opened up and you were first on the waiting list: your registration is now confirmed.
mail.waitlistPromoted.cta=View my registrations

# El organizador le saco el lugar a alguien confirmado
mail.registrationRevoked.subject=Your spot at "{0}" was cancelled
mail.registrationRevoked.title=Your spot was cancelled
mail.registrationRevoked.greeting=Hi {0},
mail.registrationRevoked.body=The organizer of "{0}" cancelled your spot at the event.
mail.registrationRevoked.cta=View other events

# Moderation: an admin removed the event after reviewing a report
mail.eventRemovedByAdmin.subject=An admin removed your event "{0}"
mail.eventRemovedByAdmin.title=Your event was removed
mail.eventRemovedByAdmin.greeting=Hi {0},
mail.eventRemovedByAdmin.body=An administrator reviewed a report about "{0}" and decided to remove it.
mail.eventRemovedByAdmin.reasonLabel=Reason
mail.eventRemovedByAdmin.cta=View other events

# Pre-publish review (not report moderation): an admin approved the newly created event
mail.eventApproved.subject=Your event "{0}" was approved and published
mail.eventApproved.title=Your event is now live!
mail.eventApproved.greeting=Hi {0},
mail.eventApproved.body=An administrator reviewed "{0}" and it's now visible to everyone on plancito.
mail.eventApproved.cta=View my event

# Pre-publish review: an admin rejected the newly created event (final)
mail.eventRejected.subject=Your event "{0}" was not approved
mail.eventRejected.title=Your event was not approved
mail.eventRejected.greeting=Hi {0},
mail.eventRejected.body=An administrator reviewed "{0}" and decided not to publish it.
mail.eventRejected.reasonLabel=Reason
mail.eventRejected.cta=View other events

# Moderation: an admin asks the creator to fix something about the event
mail.eventChangesRequested.subject=An admin requested changes to your event "{0}"
mail.eventChangesRequested.title=Changes were requested for your event
mail.eventChangesRequested.greeting=Hi {0},
mail.eventChangesRequested.body=An administrator reviewed a report about "{0}" and is asking you to fix something before it can be removed.
mail.eventChangesRequested.messageLabel=Message from the admin
mail.eventChangesRequested.cta=Edit the event

# Moderation: an admin suspended the account
mail.accountSuspended.subject=Your Plancito account was suspended
mail.accountSuspended.title=Your account was suspended
mail.accountSuspended.greeting=Hi {0},
mail.accountSuspended.body=An administrator suspended your account. You won't be able to sign in while the suspension lasts.

# Moderation: an admin reactivated the account
mail.accountReactivated.subject=Your Plancito account was reactivated
mail.accountReactivated.title=Your account was reactivated
mail.accountReactivated.greeting=Hi {0},
mail.accountReactivated.body=An administrator reactivated your account: you can sign in again.
mail.accountReactivated.cta=Sign in

# Saved search ("watchlist"): new events matching the filters were published. {0} = how many
mail.savedSearchMatches.subject={0,choice,1#There is a new event for your saved search|1<There are {0} new events for your saved search}
mail.savedSearchMatches.title=There are new events for you
mail.savedSearchMatches.greeting=Hi {0},
mail.savedSearchMatches.body={0,choice,1#An event matching one of your saved searches was published:|1<{0} events matching one of your saved searches were published. Here is one:}
mail.savedSearchMatches.cta=View the event
mail.savedSearchMatches.unsubscribe=Unsubscribe from this list
