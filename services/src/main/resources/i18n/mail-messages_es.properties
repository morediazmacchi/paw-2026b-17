# ============================================================
#  Textos de los mails - ESPANOL
# ============================================================
# TODO texto visible de los mails vive aca. En las plantillas HTML
# no hay ni una palabra escrita a mano: solo claves #{...}.
# Para agregar un idioma se copia este archivo y se traduce. Nada mas.

# --- comunes a todos los mails ---
mail.brand=plancito
mail.footer=Recibiste este mail porque usaste plancito.
mail.event.when=Cuándo
mail.event.where=Dónde
mail.event.price=Precio
mail.event.free=Gratis

# --- 1. creaste un evento (le llega al creador) ---
# El {0} se reemplaza por el titulo del evento.
mail.eventCreated.subject=Tu evento "{0}" ya está publicado
mail.eventCreated.title=¡Tu evento ya está publicado!
mail.eventCreated.greeting=Hola {0},
mail.eventCreated.body=Tu evento ya está online en plancito y la gente puede empezar a anotarse.
mail.eventCreated.cta=Ver mi evento

# --- 2. te anotaste a un evento (le llega al inscripto) ---
mail.registrationConfirmed.subject=Confirmamos tu lugar en "{0}"
mail.registrationConfirmed.title=¡Tenés tu lugar!
mail.registrationConfirmed.greeting=Hola {0},
mail.registrationConfirmed.body=Confirmamos tu inscripción. Te esperamos.
mail.registrationConfirmed.cta=Ir a mis inscripciones

# --- 3. alguien se anoto a tu evento (le llega al creador) ---
mail.newRegistration.subject=Alguien más se sumó a "{0}"
mail.newRegistration.title=Tenés una inscripción nueva
mail.newRegistration.greeting=Hola {0},
mail.newRegistration.body={0} se anotó a tu evento.
mail.newRegistration.cta=Ver las inscripciones

# --- 4. te registraste (o completaste una cuenta fantasma): confirmar el mail ---
mail.accountVerification.subject=Confirmá tu cuenta de plancito
mail.accountVerification.title=¡Ya casi estás!
mail.accountVerification.greeting=Hola {0},
mail.accountVerification.body=Confirmá tu cuenta para poder iniciar sesión en plancito.
mail.accountVerification.cta=Confirmar mi cuenta

# --- 5. pediste "olvide mi contraseña" ---
mail.passwordReset.subject=Restablecé tu contraseña de plancito
mail.passwordReset.title=Restablecé tu contraseña
mail.passwordReset.greeting=Hola {0},
mail.passwordReset.body=Pediste restablecer tu contraseña. Si no fuiste vos, ignorá este mail.
mail.passwordReset.cta=Elegir nueva contraseña

# --- 6. quedaste en lista de espera (le llega al inscripto) ---
mail.waitlistJoined.subject=Quedaste en la lista de espera de "{0}"
mail.waitlistJoined.title=Estás en la lista de espera
mail.waitlistJoined.greeting=Hola {0},
mail.waitlistJoined.body=El evento ya está completo, así que te anotamos en la lista de espera. Si se libera un lugar te avisamos por mail.
mail.waitlistJoined.cta=Ir a mis inscripciones

# --- 7. alguien entro a la lista de espera de tu evento (le llega al creador) ---
mail.waitlistNewEntry.subject=Alguien está esperando lugar en "{0}"
mail.waitlistNewEntry.title=Tenés alguien en lista de espera
mail.waitlistNewEntry.greeting=Hola {0},
mail.waitlistNewEntry.body={0} quedó en la lista de espera porque tu evento ya está completo.
mail.waitlistNewEntry.cta=Ver las inscripciones

# --- 8. se libero un lugar: invitacion con link (le llega a quien esta primero en la lista) ---

# --- 9. te anotaste a un evento con confirmacion del organizador (le llega al inscripto) ---
mail.registrationPending.subject=Recibimos tu pedido para "{0}"
mail.registrationPending.title=Tu pedido está en revisión
mail.registrationPending.greeting=Hola {0},
mail.registrationPending.body=Este evento necesita que el organizador confirme cada inscripción. Te avisamos apenas lo revise.
mail.registrationPending.cta=Ver mis inscripciones

# --- 10. alguien pidio anotarse a tu evento con confirmacion (le llega al creador) ---
mail.newPendingRegistration.subject=Tenés un pedido para revisar en "{0}"
mail.newPendingRegistration.title=Tenés un pedido nuevo
mail.newPendingRegistration.greeting=Hola {0},
mail.newPendingRegistration.body={0} pidió anotarse a tu evento. Tenés que aceptarlo o rechazarlo vos.
mail.newPendingRegistration.cta=Aceptar o rechazar

# --- 11. el creador acepto tu pedido pendiente (le llega al inscripto) ---
mail.registrationApproved.subject=Confirmaron tu lugar en "{0}"
mail.registrationApproved.title=¡El organizador te confirmó!
mail.registrationApproved.greeting=Hola {0},
mail.registrationApproved.body=El organizador revisó tu pedido y ya tenés tu lugar. Te esperamos.
mail.registrationApproved.cta=Ir a mis inscripciones

# --- 12. el creador rechazo tu pedido pendiente (le llega al inscripto) ---
mail.registrationRejected.subject=Tu pedido para "{0}" no fue aceptado
mail.registrationRejected.title=Tu pedido no fue aceptado
mail.registrationRejected.greeting=Hola {0},
mail.registrationRejected.body=El organizador de "{0}" no aceptó tu pedido de inscripción esta vez.
mail.registrationRejected.cta=Ver otros eventos

# --- 13. te invitaron a un evento privado (le llega a la persona invitada) ---
mail.eventInvitation.subject=Te invitaron a "{0}"
mail.eventInvitation.title=¡Tenés una invitación!
mail.eventInvitation.greeting=Hola {0},
mail.eventInvitation.body=Alguien te invitó a un evento privado. Solo vos (y quien más esté invitado) pueden verlo.
mail.eventInvitation.cta=Ver el evento
mail.eventInvitation.footnote=Para verlo tenés que ingresar con la cuenta de este email. Si todavía no tenés una, podés crearla.

# --- 9. tu evento se lleno (le llega al creador) ---
mail.eventFull.subject=Tu evento "{0}" está completo
mail.eventFull.title=¡Tu evento se llenó!
mail.eventFull.greeting=Hola {0},
mail.eventFull.body=Se ocupó el último lugar de tu evento.
mail.eventFull.cta=Ver mi evento
mail.eventFull.footnote=A partir de ahora, quien quiera sumarse va a quedar en la lista de espera. Si alguien se da de baja, el lugar pasa automáticamente a la primera persona que esté esperando.

# --- 10. alguien se dio de baja de tu evento (le llega al creador) ---
mail.registrationCancelled.subject=Se liberó un lugar en "{0}"
mail.registrationCancelled.title=Alguien canceló su inscripción
mail.registrationCancelled.greeting=Hola {0},
mail.registrationCancelled.body={0} se dio de baja de tu evento.
mail.registrationCancelled.offered=Como tenías gente esperando, ya avanzó la primera persona de la lista de espera: queda confirmada, o pendiente de tu aprobación si el evento la requiere.
mail.registrationCancelled.open=El lugar quedó disponible para que alguien más se anote.
mail.registrationCancelled.cta=Ver mi evento

# --- 14. el organizador cancelo el evento (le llega a cada inscripto confirmado) ---
mail.eventCancelled.subject=Se canceló el evento "{0}"
mail.eventCancelled.title=Un evento al que estabas anotado se canceló
mail.eventCancelled.greeting=Hola {0},
mail.eventCancelled.body=El organizador canceló "{0}". Lamentamos las molestias.
mail.eventCancelled.cta=Ver otros eventos

# --- 15. el organizador edito el evento (le llega a cada inscripto confirmado) ---
mail.eventUpdated.subject=Se actualizó "{0}"
mail.eventUpdated.title=Un evento al que estás anotado cambió
mail.eventUpdated.greeting=Hola {0},
mail.eventUpdated.body=El organizador actualizó los datos de "{0}". Revisá que todo te siga sirviendo.
mail.eventUpdated.cta=Ver mi evento

# Recordatorio automatico: el evento empieza en menos de 24 hs.
mail.eventReminder.subject=En menos de 24 hs tenés "{0}"
mail.eventReminder.title=¡Ya casi es el día!
mail.eventReminder.greeting=Hola {0},
mail.eventReminder.body=Te recordamos que "{0}" empieza en menos de 24 hs. ¡Te esperamos!
mail.eventReminder.cta=Ver el evento
mail.organizerReminder.subject=Faltan menos de 24 hs para "{0}"
mail.organizerReminder.title=Tu evento es en menos de 24 hs
mail.organizerReminder.greeting=Hola {0},
mail.organizerReminder.body=Faltan menos de 24 hs para "{0}". Podés revisar quiénes están anotados.
mail.organizerReminder.cta=Ver inscriptos

# Preguntas y respuestas
mail.newQuestion.subject=Te hicieron una pregunta sobre "{0}"
mail.newQuestion.title=Tenés una pregunta nueva
mail.newQuestion.greeting=Hola {0},
mail.newQuestion.body={0} preguntó sobre "{1}":
mail.newQuestion.cta=Responder
mail.questionAnswered.subject=Respondieron tu pregunta sobre "{0}"
mail.questionAnswered.title=Tu pregunta tiene respuesta
mail.questionAnswered.greeting=Hola {0},
mail.questionAnswered.body=El organizador de "{0}" respondió tu pregunta.
mail.questionAnswered.question=Tu pregunta
mail.questionAnswered.answer=Respuesta
mail.questionAnswered.cta=Ver el evento

# Lista de espera: se libero un lugar y pasa directo a confirmado
mail.waitlistPromoted.subject=¡Ya tenés lugar en "{0}"!
mail.waitlistPromoted.title=¡Ya tenés tu lugar!
mail.waitlistPromoted.greeting=Hola {0},
mail.waitlistPromoted.body=Se liberó un lugar y eras la primera persona de la lista de espera: tu inscripción quedó confirmada.
mail.waitlistPromoted.cta=Ver mis inscripciones

# El organizador le saco el lugar a alguien confirmado
mail.registrationRevoked.subject=Tu lugar en "{0}" fue cancelado
mail.registrationRevoked.title=Tu lugar fue cancelado
mail.registrationRevoked.greeting=Hola {0},
mail.registrationRevoked.body=El organizador de "{0}" canceló tu lugar en el evento.
mail.registrationRevoked.cta=Ver otros eventos

# Moderacion: un admin dio de baja el evento tras revisar un reporte
mail.eventRemovedByAdmin.subject=Un admin dio de baja tu evento "{0}"
mail.eventRemovedByAdmin.title=Tu evento fue dado de baja
mail.eventRemovedByAdmin.greeting=Hola {0},
mail.eventRemovedByAdmin.body=Un administrador revisó un reporte sobre "{0}" y decidió darlo de baja.
mail.eventRemovedByAdmin.reasonLabel=Motivo
mail.eventRemovedByAdmin.cta=Ver otros eventos

# Moderacion: un admin suspendio la cuenta
mail.accountSuspended.subject=Tu cuenta de Plancito fue suspendida
mail.accountSuspended.title=Tu cuenta fue suspendida
mail.accountSuspended.greeting=Hola {0},
mail.accountSuspended.body=Un administrador suspendió tu cuenta. Mientras dure la suspensión no vas a poder iniciar sesión.

# Moderacion: un admin reactivo la cuenta
mail.accountReactivated.subject=Tu cuenta de Plancito fue reactivada
mail.accountReactivated.title=Tu cuenta fue reactivada
mail.accountReactivated.greeting=Hola {0},
mail.accountReactivated.body=Un administrador reactivó tu cuenta: ya podés volver a iniciar sesión.
mail.accountReactivated.cta=Iniciar sesión
