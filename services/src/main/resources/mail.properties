# ============================================================
#  Configuracion del servidor de mail (SMTP)
# ============================================================
# Este archivo NO tiene codigo Java. Solo pares clave=valor.
# MailConfig lo lee y arma el bean JavaMailSender con estos datos.
# Cambiar de servidor = editar este archivo, no tocar codigo.

# --- DESARROLLO: servidor SMTP falso corriendo en la propia maquina ---
# No manda nada a internet, solo recibe el mail y lo muestra.
# Sirve para probar sin necesidad de credenciales reales.
mail.host=localhost
mail.port=2525
mail.username=
mail.password=
mail.auth=false
mail.starttls=false
mail.from=Plancito <no-reply@plancito.local>

# URL base de la aplicacion, sin barra al final.
# Los links de los mails TIENEN que ser absolutos: un mail se abre en Gmail,
# no dentro de nuestra app, asi que un href="/eventos/1" se resolveria contra
# mail.google.com y daria 404. Por eso hace falta el dominio completo.
app.base-url=http://localhost:8080

# --- PRODUCCION (Gmail): comentar el bloque de arriba y descomentar este ---
# mail.password NO es la contrasena de la cuenta: es una "App Password"
# de 16 caracteres que se genera en la configuracion de seguridad de Google
# (requiere tener activada la verificacion en 2 pasos).
#mail.host=smtp.gmail.com
#mail.port=587
#mail.username=CUENTA@gmail.com
#mail.password=xxxxxxxxxxxxxxxx
#mail.auth=true
#mail.starttls=true
#mail.from=Plancito <CUENTA@gmail.com>
# El paw-2026b-17 del final es el context path, o sea el nombre del .war en pampero.
#app.base-url=http://pawserver.it.itba.edu.ar/paw-2026b-17
