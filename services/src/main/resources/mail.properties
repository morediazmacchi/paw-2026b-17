# ============================================================
#  Configuracion del servidor de mail (SMTP)
# ============================================================
# Este archivo NO tiene codigo Java. Solo pares clave=valor.
# MailConfig lo lee y arma el bean JavaMailSender con estos datos.
# Cambiar de servidor = editar este archivo, no tocar codigo.

# ------------------------------------------------------------
#  >>> COMPLETAR ESTAS DOS LINEAS <<<
# ------------------------------------------------------------
# El mail completo de la cuenta de Plancito, con @gmail.com
mail.username=pasitoweb@gmail.com
# Los 16 caracteres de la App Password (NO la contrasena de la cuenta).
# Google la muestra separada en 4 grupos de 4: pegarla SIN espacios.
mail.password=ebtobidgipufqums
# ------------------------------------------------------------

# --- GMAIL ---
mail.host=smtp.gmail.com
mail.port=587
mail.auth=true
mail.starttls=true

# Remitente. El ${mail.username} se reemplaza solo por lo que pusiste arriba,
# asi no hay que escribir el mail dos veces.
# (Gmail no deja mentir en el From: tiene que ser la misma cuenta autenticada.)
mail.from=Plancito <${mail.username}>

# URL base de la aplicacion, sin barra al final.
# Los links de los mails TIENEN que ser absolutos: un mail se abre en Gmail,
# no dentro de nuestra app, asi que un href="/eventos/1" se resolveria contra
# mail.google.com y daria 404. Por eso hace falta el dominio completo.
//app.base-url=http://localhost:8080
# En pampero seria:
app.base-url=http://pawserver.it.itba.edu.ar/paw-2026b-17


