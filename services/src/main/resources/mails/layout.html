<!DOCTYPE html>
<!--
  Base de estilo comun a todos los mails (lo pidio la catedra).
  Las 3 plantillas insertan su contenido aca adentro, asi el encabezado,
  el pie y los colores se escriben UNA sola vez.

  Por que tablas y estilos "inline" en vez de CSS lindo:
  los clientes de mail (Gmail, Outlook) no soportan CSS moderno.
  Flexbox, grid y hasta hojas de estilo externas se ignoran o rompen.
  La forma que funciona en todos lados sigue siendo tablas + style="" a mano.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body th:fragment="page(content)" style="margin:0; padding:0; background-color:#f4f4f5;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#f4f4f5; padding:24px 12px;">
  <tr>
    <td align="center">

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:560px; background-color:#ffffff; border-radius:12px;
                    overflow:hidden; border:1px solid #e5e7eb;
                    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

        <!-- encabezado -->
        <tr>
          <td style="background-color:#111827; padding:20px 28px;">
            <span style="color:#ffffff; font-size:20px; font-weight:700; letter-spacing:-0.4px;"
                  th:text="#{mail.brand}">plancito</span>
          </td>
        </tr>

        <!-- aca entra el contenido de cada mail -->
        <tr>
          <td style="padding:28px; color:#111827; font-size:15px; line-height:1.6;">
            <th:block th:replace="${content}">contenido</th:block>
          </td>
        </tr>

        <!-- pie -->
        <tr>
          <td style="padding:18px 28px; background-color:#fafafa; border-top:1px solid #e5e7eb;
                     color:#6b7280; font-size:12px; line-height:1.5;">
            <span th:text="#{mail.footer}">pie</span>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
