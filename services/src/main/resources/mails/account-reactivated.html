<!DOCTYPE html>
<!--/*
  Un admin reactivo la cuenta -> le llega a esa persona.
  Variables: personName
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::content})}">
<body>
<th:block th:fragment="content">

  <h1 style="margin:0 0 8px; font-size:22px; line-height:1.3; color:#111827;"
      th:text="#{mail.accountReactivated.title}">Titulo</h1>

  <p style="margin:0 0 4px; color:#6b7280;"
     th:text="#{mail.accountReactivated.greeting(${personName})}">Hola</p>

  <p style="margin:0 0 20px;"
     th:text="#{mail.accountReactivated.body}">Cuerpo</p>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 0;">
    <tr><td style="background-color:#111827; border-radius:8px;">
      <a th:href="${loginUrl}" href="#"
         style="display:inline-block; padding:12px 22px; color:#ffffff;
                text-decoration:none; font-size:15px; font-weight:600;"
         th:text="#{mail.accountReactivated.cta}">Iniciar sesión</a>
    </td></tr>
  </table>

</th:block>
</body>
</html>
