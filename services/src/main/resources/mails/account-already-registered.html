<!DOCTYPE html>
<!--/*
  Alguien intento registrarse con el mail de una cuenta que YA existe -> le llega a la dueña de esa cuenta.
  A quien intento registrarse no se le dice nada (la pagina responde igual que con una cuenta nueva).
  Variables: personName, loginUrl, forgotPasswordUrl
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::content})}">
<body>
<th:block th:fragment="content">

  <h1 style="margin:0 0 8px; font-size:22px; line-height:1.3; color:#111827;"
      th:text="#{mail.accountAlreadyRegistered.title}">Titulo</h1>

  <p style="margin:0 0 4px; color:#6b7280;"
     th:text="#{mail.accountAlreadyRegistered.greeting(${personName})}">Hola</p>

  <p style="margin:0 0 20px;"
     th:text="#{mail.accountAlreadyRegistered.body}">Cuerpo</p>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 12px;">
    <tr><td style="background-color:#111827; border-radius:8px;">
      <a th:href="${loginUrl}" href="#"
         style="display:inline-block; padding:12px 22px; color:#ffffff;
                text-decoration:none; font-size:15px; font-weight:600;"
         th:text="#{mail.accountAlreadyRegistered.cta}">Iniciar sesión</a>
    </td></tr>
  </table>

  <p style="margin:0 0 20px;">
    <a th:href="${forgotPasswordUrl}" href="#" style="color:#111827;"
       th:text="#{mail.accountAlreadyRegistered.forgotCta}">Restablecer mi contraseña</a>
  </p>

  <p style="margin:0; color:#6b7280; font-size:13px;"
     th:text="#{mail.accountAlreadyRegistered.ignore}">Si no fuiste vos, ignorá este mensaje.</p>

</th:block>
</body>
</html>
