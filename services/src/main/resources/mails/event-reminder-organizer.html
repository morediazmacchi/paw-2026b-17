<!DOCTYPE html>
<!--/*
  Recordatorio automatico: el evento empieza en menos de 24 hs -> le llega a
  quien lo organiza (ver EventReminderServiceImpl). El boton lleva a Inscriptos.
  Variables: personName, eventTitle, eventDate, eventPlace, attendeesUrl
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::content})}">
<body>
<th:block th:fragment="content">

  <h1 style="margin:0 0 8px; font-size:22px; line-height:1.3; color:#111827;"
      th:text="#{mail.organizerReminder.title}">Titulo</h1>

  <p style="margin:0 0 4px; color:#6b7280;"
     th:text="#{mail.organizerReminder.greeting(${personName})}">Hola</p>

  <p style="margin:0 0 12px;"
     th:text="#{mail.organizerReminder.body(${eventTitle})}">Cuerpo</p>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#f9fafb; border:1px solid #e5e7eb; border-radius:10px; padding:16px; margin:0 0 20px;">
    <tr><td>
      <div style="font-size:17px; font-weight:700; margin-bottom:10px;"
           th:text="${eventTitle}">Titulo del evento</div>

      <div style="font-size:14px; color:#374151; margin-bottom:4px;">
        <span style="color:#6b7280;" th:text="#{mail.event.when}">Cuando</span>:
        <span th:text="${eventDate}">fecha</span>
      </div>
      <div style="font-size:14px; color:#374151;">
        <span style="color:#6b7280;" th:text="#{mail.event.where}">Donde</span>:
        <span th:text="${eventPlace}">lugar</span>
      </div>
    </td></tr>
  </table>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 0;">
    <tr><td style="background-color:#111827; border-radius:8px;">
      <a th:href="${attendeesUrl}" href="#"
         style="display:inline-block; padding:12px 22px; color:#ffffff;
                text-decoration:none; font-size:15px; font-weight:600;"
         th:text="#{mail.organizerReminder.cta}">Ver inscriptos</a>
    </td></tr>
  </table>

</th:block>
</body>
</html>
