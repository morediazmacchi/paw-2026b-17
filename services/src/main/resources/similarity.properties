# Parametros de la similitud entre eventos y de las recomendaciones (ver EventSimilarity y
# EventSimilarityServiceImpl). Cambiar cualquiera requiere reiniciar la app; no hace falta
# recompilar si se usa un archivo externo: arrancar la JVM con
#   -Dpaw.similarity.config=/ruta/a/similarity.properties
# y poner ahi solo las claves a cambiar (las que falten quedan con los valores de este archivo).
#
# Los valores de este archivo son los calibrados; ver SimilarityParameters para el significado.

# ---- S(a, b): peso de cada feature (no hace falta que sumen 1) ----
similarity.weight.category=0.35
similarity.weight.price=0.15
similarity.weight.neighborhood=0.15
similarity.weight.hour=0.15
similarity.weight.weekday=0.05
similarity.weight.organizer=0.15

# Gratis contra pago: hasta que fraccion de un "igual de gratis" puede parecerse (0 a 1).
similarity.price.free-vs-paid-factor=0.5
# Cada cuantos segundos se recalcula la distribucion de precios (86400 = un dia).
similarity.price.refresh-seconds=86400
# Categorias que no cuentan para comparar, separadas por coma.
similarity.category.ignored=Otros

# ---- "Te puede interesar" ----
# Como mucho cuantos eventos, y el S minimo para que uno entre.
similarity.related.limit=5
similarity.related.min-score=0.5

# ---- Orden RECOMENDADOS ----
# Un par (candidato, evento asistido) suma si S >= threshold.
similarity.user.threshold=0.6
# Se miran los ultimos N eventos asistidos.
similarity.user.history-size=30
# Cada evento asistido pesa 1 + recency-bonus * 0.5^(antiguedad_en_dias / half-life-days).
similarity.user.recency-half-life-days=180
similarity.user.recency-bonus=0.5
